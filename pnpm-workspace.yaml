packages:
  - apps/*
  - packages/*

# Кроме платформы разработчика ставим бинарники под linux-arm64/x64,
# чтобы проверки (tsc, vitest, vite build) запускались и в Linux-песочнице.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, arm64, x64]
  libc: [glibc]

onlyBuiltDependencies:
  - esbuild
  - msw
